label: Hero
description: Opening section with a strong heading, supporting text, buttons, and an image or a video behind it. The steps layout adds up to four numbered steps over the image. As the first block of a page it becomes the page title (h1).
category: Openers
variants:
  split: Text and image side by side
  centered: Centered text, wide image below
  cover: Text over a full-width image
  steps: Text over a full-width image, with numbered steps
  minimal: Large heading, no image
fields:
  eyebrow:
    type: text
    label: Eyebrow
    placeholder: Short label above the heading
  heading:
    type: text
    label: Heading
    required: true
  text:
    type: textarea
    label: Text
  actions:
    type: repeater
    label: Buttons
    item_label: Button
    max: 2
    fields:
      label: { type: text, label: Label }
      url: { type: link, label: Link, help: 'A page ("contact"), a path ("/en/contact"), a full URL, #anchor, mailto: or tel:' }
      style: { type: select, label: Style, default: primary, options: { primary: Primary, secondary: Secondary } }
  highlights:
    type: repeater
    label: Highlights
    item_label: Highlight
    max: 3
    fields:
      text: { type: text, label: Text }
  items:
    type: repeater
    label: Steps
    item_label: Step
    max: 4
    fields:
      title: { type: text, label: Title }
      text: { type: textarea, label: Text }
      link: { type: link, label: Link }
      link_label: { type: text, label: Link text, placeholder: Learn more }
  background:
    type: select
    label: Picture
    default: image
    options:
      image: Image
      video: Video that plays behind the text
  image:
    type: image
    label: Image
    when: { background: image }
  image_alt:
    type: text
    label: Image description
    help: What the image shows, for people who cannot see it. Leave empty if it is purely decorative.
    when: { background: image }
  video:
    type: video
    label: Video
    placeholder: https://www.youtube.com/watch?v=…
    help: 'Choose a video from the media library (.mp4 or .webm), or paste a YouTube or Vimeo link, or the address of a video file elsewhere. It plays silently, in a loop, with a pause button. A YouTube or Vimeo video is loaded from them when the page opens.'
    when: { background: video }
  video_poster:
    type: image
    label: Still image
    help: Shown while the video loads, when the visitor has asked their device for less motion, and under a video that is paused. Recommended, and it is the share image of the page when it has none.
    when: { background: video }
