label: Columns
description: Two or three columns side by side, each with an optional picture, a heading, text and a link. Stacks on a phone.
variants:
  image-side: Picture beside the text
  image-top: Picture above the text
fields:
  eyebrow:
    type: text
    label: Eyebrow
  heading:
    type: text
    label: Heading
  intro:
    type: textarea
    label: Introduction
  items:
    type: repeater
    label: Columns
    item_label: Column
    max: 3
    fields:
      eyebrow: { type: text, label: Label above the heading }
      title: { type: text, label: Heading }
      url: { type: link, label: Link, help: 'The heading becomes a link, and the link text below a button.' }
      image: { type: image, label: Picture }
      image_alt: { type: text, label: Picture description }
      text: { type: markdown, label: Text }
      link_label: { type: text, label: Link text }
