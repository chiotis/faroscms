    - { type: features, variant: numbered, tone: muted, anchor: how, eyebrow: 'How we work', heading: 'Three steps', columns: '3', items: [{ title: 'We talk', text: 'We listen to what you need.' }, { title: 'We plan', text: 'You get a proposal and a price.' }, { title: 'We deliver', text: 'You start with what we agreed.' }] }
    - { type: stats, variant: cards, items: [{ value: '120+', label: 'Happy clients' }, { value: '4,9/5', label: 'Average rating' }, { value: '24h', label: 'Reply time' }] }
    - { type: quote, quote: 'A short, convincing client quote that answers the most common objection.', name: 'First Last', role: 'Role, Company' }
    - { type: form, variant: split, tone: muted, anchor: form, eyebrow: 'Get a quote', heading: 'Tell us what you need', intro: 'Fill in the form and we will reply within one working day.', form: contact }
    - { type: faq, variant: stacked, heading: 'Common questions', items: [{ question: 'How much does it cost?', answer: 'Explain what it depends on and give an indication.' }, { question: 'How soon can we start?', answer: 'Give a realistic timeline.' }] }
