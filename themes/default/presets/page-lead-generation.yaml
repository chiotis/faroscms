kind: page
template: landing
label: { el: 'Landing για δυνητικούς πελάτες', en: 'Lead generation landing page' }
description: { el: 'Hero με φόρμα στο τέλος: υπόσχεση, οφέλη, διαδικασία, νούμερα, σχόλιο, φόρμα και ερωτήσεις. Χρησιμοποιεί το template Landing.', en: 'A hero that leads to a form: a promise, benefits, process, numbers, a quote, the form, and questions. Uses the Landing template.' }
blocks:
  el:
