    - { type: form, variant: split, tone: muted, anchor: form, eyebrow: 'Ζητήστε προσφορά', heading: 'Πείτε μας τι χρειάζεστε', intro: 'Συμπληρώστε τη φόρμα και θα σας απαντήσουμε το πολύ σε μία εργάσιμη.', form: contact }
