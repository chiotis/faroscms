# FarosCMS default theme manifest.
#
# The admin Theme tab is generated from `settings`, and stored values are checked against it on
# every request: a missing value takes its default and an invalid one falls back to the default.
# Update-safety rules (see docs/theming.md):
#   - add fields and options freely, always with a default;
#   - never rename or remove a field or an option value that sites may have stored;
#   - retire a field by marking it `hidden: true` (it keeps its stored value), not by deleting it.
name: default
label: FarosCMS Default
version: 1.18.3
description: All-purpose FarosCMS theme.

menu_locations:
  header:
    label: Header
    default: main
  footer:
    label: Footer
    default: footer
  footer_legal:
    label: Footer bottom links
    default: legal

# Templates editors can choose per page or post (front matter `template:`). "default" means the
# normal template hierarchy. Keep keys stable: content refers to them by name.
page_templates:
  default:
    label: Standard
    description: Title header, then the text and the blocks.
  landing:
    label: Landing
    description: No title header. The page is built from blocks only; start it with a Hero.
  sidebar:
    label: With sidebar
    description: Text beside a sidebar with the page's contents, related pages, and a contact card. Blocks follow below.

# What a content type's single page can be, offered on a card for each type in Admin > Theme > Single Layouts (the cards
# follow the content types the site has). The page layout (a template from page_templates) is chosen there too. Values are
# stored under theme_settings.single_layouts.<type>; a type with no choice yet gets the defaults.
single_layouts:
  label: Single Layouts
  description: How the page of one entry looks, for each content type.
  fields:
    title:
      type: select
      label: Title area
      default: default
      options:
        default: Default
        centered: Centered
        split: Split
        cover: Cover
        minimal: Minimal
    header:
      type: select
      label: Header
      default: site
      options:
        site: Site default
        'on': Over the title
        'off': Solid
    sidebar:
      type: select
      label: Sidebar
      default: none
      options:
        none: None
        right: Right
        left: Left
    image:
      type: toggle
      label: Image
      default: true
    excerpt:
      type: toggle
      label: Excerpt
      default: true
    byline:
      type: toggle
      label: Date and terms
      default: true
    toc:
      type: toggle
      label: Contents
      default: true
    related:
      type: toggle
      label: Related pages
      default: true
    card:
      type: toggle
      label: Contact card
      default: true

settings:
  appearance:
    label: Appearance
    description: Colour mode, palette, font pairing, corners and decoration, the starting points of the look.
    columns: 4
    fields:
      mode:
        type: select
        label: Mode
        default: system
        options:
          system: System
          light: Light
          dark: Dark
      palette:
        type: select
        label: Palette
        default: slate
        options:
          slate: Slate
          indigo: Indigo
          emerald: Emerald
          teal: Teal
          rose: Rose
          amber: Amber
          garnet: 'Garnet (deep red on warm paper)'
      font:
        type: select
        label: Font
        default: sans
        options:
          sans: 'Inter'
          display: 'Serif headings, Inter text'
          serif: Serif
          system: 'System fonts (no download)'
      glow:
        type: select
        label: Decoration
        default: soft
        help: The soft coloured glows behind headings and in cards. Solid keeps every surface a flat colour.
        options:
          soft: Soft glows
          solid: Solid colours only
      shape:
        type: select
        label: Corners
        default: soft
        options:
          soft: Soft
          rounded: Rounded
          sharp: Sharp

  header:
    label: Header
    description: Layout and behaviour of the site header.
    columns: 3
    fields:
      layout:
        type: select
        label: Layout
        default: classic
        options:
          classic: 'Classic: logo left, menu right'
          menu_left: 'Menu left: logo and menu together on the left, tools on the right'
          split: 'Split: menu left, logo in the middle, tools right'
          centered: 'Centered: logo in the middle, menu below'
          stacked: 'Stacked: menu in a bar underneath'
          minimal: 'Minimal: logo and a menu button'
          minimal_center: 'Minimal centered: menu button left, logo in the middle'
      shape:
        type: select
        label: Shape
        default: full
        options:
          full: Full width bar
          floating: Floating, detached from the edges
      width:
        type: select
        label: Content width
        default: contained
        options:
          contained: Contained like the page
          wide: Wide, edge to edge
      size:
        type: select
        label: Height
        default: regular
        options:
          regular: Regular
          compact: Compact
          tall: Tall
      border:
        type: select
        label: Edge
        default: line
        options:
          line: A thin line
          none: Nothing
          shadow: A soft shadow
      nav_style:
        type: select
        label: Menu links
        default: soft
        options:
          soft: Soft background on hover
          underline: Underline
          plain: Plain text
      sticky:
        type: select
        label: Sticky
        default: on_scroll
        options:
          on_scroll: Slides in after scrolling
          always: Always at the top
          smart: 'Hides when scrolling down, returns when scrolling up'
          'off': Scrolls away
      shrink:
        type: toggle
        label: Shrinks once the page is scrolled
        help: Works with the header that stays at the top.
        default: false
      row_tone:
        type: select
        label: Header background
        default: default
        help: The row with the logo. A solid colour, not a gradient.
        options:
          default: Page background
          muted: Muted (the soft surface colour)
          soft: Soft tint of the palette colour
          contrast: Dark
          accent: Palette colour
      search:
        type: select
        label: Search
        default: icon
        options:
          icon: 'An icon that opens the search page'
          field: 'A search box in the header'
          none: 'No search'
      show_language:
        type: toggle
        label: Language switcher
        default: true
      show_mode:
        type: toggle
        label: Dark mode switch
        default: true
      bar_tone:
        type: select
        label: Menu bar background (stacked)
        default: default
        options:
          default: Page background
          muted: Muted
          contrast: Dark
          accent: Palette colour
      transparent:
        type: toggle
        label: Transparent over an opening hero
        help: On pages that start with a Hero block, or a full width Slider, the header sits over it and turns solid on scroll.
        default: false
      mobile_menu:
        type: select
        label: Phone menu
        default: drawer
        help: How the menu opens on small screens. The bottom sheet suits the bottom bar; the full screen suits few, large links.
        options:
          drawer: 'Side drawer from the left'
          drawer_right: 'Side drawer from the right'
          fullscreen: 'Full screen with large links'
          top_sheet: 'Sheet dropping from the top'
          bottom_sheet: 'Sheet rising from the bottom'
      mobile_bar:
        type: toggle
        label: Bottom bar on phones
        help: A bar of icons fixed at the bottom of small screens, with the Menu button and the links below. The menu button leaves the header while it is on.
        default: false
      bar_items:
        type: repeater
        label: Bottom bar links
        item_label: Link
        max: 4
        span: full
        help: The links next to the Menu button in the bottom bar, each with an icon. Leave the list empty for the automatic ones (call, email, and the header button).
        fields:
          icon: { type: icon, label: Icon }
          label: { type: text, label: Label, placeholder: Call us }
          url: { type: link, label: Link, placeholder: 'tel:+302100000000, contact, or /en/contact' }
      topbar_contacts:
        type: toggle
        label: Phone and email in a top bar
        help: Uses the phone and email from the Footer section.
        default: false
      cta_label:
        type: text
        label: Button text
        default: ''
        placeholder: Get a quote
      cta_url:
        type: link
        label: Button link
        default: ''
        placeholder: contact
      cta_style:
        type: select
        label: Button style
        default: solid
        options:
          solid: Solid
          outline: Outline
      topbar_text:
        type: text
        label: Top bar message
        default: ''
        placeholder: Free consultation for new projects this month
        span: full
      topbar_url:
        type: link
        label: Top bar message link
        default: ''
        placeholder: contact
      topbar_tone:
        type: select
        label: Top bar background
        default: muted
        options:
          muted: Muted
          contrast: Dark
          accent: Palette colour
      topbar_social:
        type: toggle
        label: Social icons in the top bar
        help: Uses the profiles in Social profiles.
        default: false

  sidebar:
    label: Sidebar card
    description: The card shown in the sidebar of the "With sidebar" layout. Whether a content type has a sidebar, and what it holds, is chosen in Single Layouts.
    columns: 2
    fields:
      toc:
        type: toggle
        label: Show "On this page" contents
        default: true
        hidden: true
      related:
        type: toggle
        label: Show related pages from the main menu
        default: true
        hidden: true
      card_heading:
        type: text
        label: Card heading
        default: ''
        placeholder: Need help?
      card_text:
        type: textarea
        label: Card text
        default: ''
      card_label:
        type: text
        label: Card button text
        default: ''
        placeholder: Contact us
      card_url:
        type: link
        label: Card button link
        default: ''
        placeholder: contact
      card_contacts:
        type: toggle
        label: Show phone and email in the card
        help: Uses the phone and email from the Footer section.
        default: true

  brand:
    label: Brand
    description: The logo, the icons of the site and how it is shown when it is shared.
    columns: 2
    fields:
      logo:
        type: image
        label: Logo
        default: ''
        placeholder: /uploads/media/logo.svg
        help: Replaces the site name in the header. SVG or a wide PNG works best.
      logo_dark:
        type: image
        label: Logo for dark backgrounds
        default: ''
        placeholder: /uploads/media/logo-light.svg
        help: Used in dark mode, in the dark footer and over a dark opening hero. Without it the logo is used everywhere.
      show_name:
        type: toggle
        label: Show the site name next to the logo
        default: false
      logo_height:
        type: number
        blank: true
        min: 16
        max: 160
        label: Logo height
        placeholder: '36'
      logo_height_mobile:
        type: number
        blank: true
        min: 14
        max: 120
        label: Logo on a phone
        placeholder: '36'
        help: Empty is as on a computer.
      footer_logo_height:
        type: number
        blank: true
        min: 16
        max: 200
        label: Logo in the footer
        placeholder: '36'
      name_size:
        type: number
        blank: true
        min: 12
        max: 56
        label: Site name size
        placeholder: '21'
        help: When there is no logo.
      favicon:
        type: image
        label: Favicon
        default: ''
        placeholder: /uploads/media/favicon.svg
        help: The small icon in the browser tab. SVG, PNG or ICO.
      touch_icon:
        type: image
        label: App icon
        default: ''
        placeholder: /uploads/media/app-icon.png
        help: 180×180 pixels PNG, for the home screen of a phone.
      theme_color:
        type: color
        hex: true
        label: Browser colour
        default: ''
        placeholder: '#1e293b'
        help: Colours the address bar of the browser on a phone.
      share_image:
        type: image
        label: Default share image
        default: ''
        placeholder: /uploads/media/share.jpg
        help: 1200×630 pixels is the common size for social previews.

  # The numbers and colours behind the look of the site (the Branding screen). Every field is optional: an empty one leaves the
  # theme's own value, so a site that sets nothing here looks the same as before. Branding.php turns them into CSS.
  design:
    label: Design
    description: Colours, type, spacing, shape and buttons.
    columns: 4
    fields:
      light_accent: {type: color, hex: true, label: Accent, default: ''}
      light_background: {type: color, hex: true, label: Background, default: ''}
      light_surface: {type: color, hex: true, label: Surface, default: ''}
      light_text: {type: color, hex: true, label: Text, default: ''}
      light_muted: {type: color, hex: true, label: Muted text, default: ''}
      light_border: {type: color, hex: true, label: Border, default: ''}
      dark_accent: {type: color, hex: true, label: Accent, default: ''}
      dark_background: {type: color, hex: true, label: Background, default: ''}
      dark_surface: {type: color, hex: true, label: Surface, default: ''}
      dark_text: {type: color, hex: true, label: Text, default: ''}
      dark_muted: {type: color, hex: true, label: Muted text, default: ''}
      dark_border: {type: color, hex: true, label: Border, default: ''}
      ink:
        type: color
        hex: true
        label: Dark panels and footer
        default: ''
        help: The near-black behind pictures, dark panels and the footer.
      heading_font:
        type: select
        label: Headings
        default: pairing
        options:
          pairing: Follow the font pairing
          inter: Inter
          system: System font
          humanist: Humanist
          geometric: Geometric
          neo_grotesque: Neo-grotesque
          rounded: Rounded
          industrial: Industrial
          classical: Classical humanist
          transitional: Transitional serif
          old_style: Old-style serif
          slab: Slab serif
          didone: Didone serif
          mono: Monospace
          custom: Your own font file
      body_font:
        type: select
        label: Text
        default: pairing
        options:
          pairing: Follow the font pairing
          inter: Inter
          system: System font
          humanist: Humanist
          geometric: Geometric
          neo_grotesque: Neo-grotesque
          rounded: Rounded
          industrial: Industrial
          classical: Classical humanist
          transitional: Transitional serif
          old_style: Old-style serif
          slab: Slab serif
          didone: Didone serif
          mono: Monospace
          custom: Your own font file
      font_file:
        type: url
        label: Font file
        default: ''
        placeholder: fonts/brand.woff2
        help: A WOFF2 file (one variable font with all weights is best). Put it in custom/assets/fonts/ and type fonts/name.woff2, or give a full address.
      base_size:
        type: number
        blank: true
        min: 13
        max: 24
        label: Text size
        placeholder: '16'
        help: Headings follow it.
      line_height:
        type: decimal
        min: 1.1
        max: 2.4
        label: Line height of text
        default: ''
        placeholder: '1.65'
      scale:
        type: select
        label: Heading scale
        default: auto
        options:
          auto: Theme
          '1.125': Major second 1.125
          '1.2': Minor third 1.2
          '1.25': Major third 1.25
          '1.333': Perfect fourth 1.333
          '1.414': Augmented fourth 1.414
          '1.5': Perfect fifth 1.5
          '1.618': Golden ratio 1.618
      heading_weight:
        type: select
        label: Heading weight
        default: auto
        options:
          auto: Theme
          '400': Regular
          '500': Medium
          '600': Semibold
          '700': Bold
          '800': Extra bold
      heading_tracking:
        type: select
        label: Heading letter spacing
        default: auto
        options:
          auto: Theme
          tighter: Tighter
          tight: Tight
          normal: Normal
          wide: Wide
      heading_leading:
        type: select
        label: Heading line height
        default: auto
        options:
          auto: Theme
          tight: Tight
          normal: Normal
          relaxed: Relaxed
      heading_case:
        type: select
        label: Heading case
        default: auto
        options:
          auto: As typed
          uppercase: Capitals
      container:
        type: number
        blank: true
        min: 640
        max: 2400
        label: Content width
        placeholder: '1216'
      reading_width:
        type: number
        blank: true
        min: 480
        max: 1200
        label: Reading width
        placeholder: '736'
        help: Narrow pages and text.
      gutter:
        type: number
        blank: true
        min: 16
        max: 160
        label: Side margin
        placeholder: '40'
        help: A phone keeps 20.
      section_space:
        type: number
        blank: true
        min: 16
        max: 320
        label: Space between sections
        placeholder: '112'
        help: Phones use about half.
      header_height:
        type: number
        blank: true
        min: 40
        max: 200
        label: Header height
        placeholder: '72'
        help: Compact and tall follow it.
      spacing:
        type: select
        label: Spacing
        default: auto
        options:
          auto: Theme
          tight: Tight
          airy: Airy
          roomy: Roomy
      radius:
        type: number
        blank: true
        min: 0
        max: 48
        label: Corner radius
        placeholder: '14'
        help: Empty follows Corners.
      button_radius:
        type: select
        label: Button corners
        default: auto
        options:
          auto: Theme
          pill: Pill
          rounded: Rounded
          square: Square
      shadows:
        type: select
        label: Shadows
        default: auto
        options:
          auto: Theme
          none: None
          strong: Strong
      button_height:
        type: number
        blank: true
        min: 28
        max: 80
        label: Button height
        placeholder: '46'
      button_pad:
        type: number
        blank: true
        min: 8
        max: 80
        label: Button side padding
        placeholder: '22'
      button_size:
        type: number
        blank: true
        min: 11
        max: 24
        label: Button text size
        placeholder: '15'
      button_weight:
        type: select
        label: Button text weight
        default: auto
        options:
          auto: Theme
          '500': Medium
          '600': Semibold
          '700': Bold
          '800': Extra bold
      button_case:
        type: select
        label: Button text case
        default: auto
        options:
          auto: As typed
          uppercase: Capitals

  social:
    label: Social profiles
    description: Shown as icons in the footer and mobile menu, and listed in the site's structured data.
    columns: 2
    fields:
      facebook:
        type: url
        label: Facebook
        default: ''
        placeholder: https://www.facebook.com/…
      instagram:
        type: url
        label: Instagram
        default: ''
        placeholder: https://www.instagram.com/…
      linkedin:
        type: url
        label: LinkedIn
        default: ''
        placeholder: https://www.linkedin.com/company/…
      youtube:
        type: url
        label: YouTube
        default: ''
        placeholder: https://www.youtube.com/@…
      x:
        type: url
        label: X (Twitter)
        default: ''
        placeholder: https://x.com/…

  # Retired by Single Layouts (single_layouts, above): the values sites stored here are the starting point of their
  # single layouts until the Single Layouts tab is saved. The options stay: the editor offers them for one entry.
  hero_layouts:
    label: Hero Layouts
    description: How the title area looks per content type, with the layouts of the Hero block.
    columns: 5
    fields:
      default:
        type: select
        label: Default
        default: default
        hidden: true
        options: &hero_layouts
          default: Default
          centered: Centered
          split: Split
          cover: Cover
          minimal: Minimal
      pages:
        type: select
        label: Pages
        default: default
        hidden: true
        options: *hero_layouts
      posts:
        type: select
        label: Posts
        default: default
        hidden: true
        options: *hero_layouts
      projects:
        type: select
        label: Projects
        default: default
        hidden: true
        options: *hero_layouts
      forms:
        type: select
        label: Forms
        default: default
        hidden: true
        options: *hero_layouts

  # Retired by Single Layouts, like hero_layouts above.
  transparent_header:
    label: Transparent Header
    description: Whether the header sits over the opening hero (a Hero block, a full width Slider, or the title area) and turns solid on scroll.
    columns: 5
    fields:
      default:
        type: select
        label: Other types
        default: site
        hidden: true
        options: &transparent_choices
          site: Site default
          'on': 'On'
          'off': 'Off'
      pages:
        type: select
        label: Pages
        default: site
        hidden: true
        options: *transparent_choices
      posts:
        type: select
        label: Posts
        default: site
        hidden: true
        options: *transparent_choices
      projects:
        type: select
        label: Projects
        default: site
        hidden: true
        options: *transparent_choices
      forms:
        type: select
        label: Forms
        default: site
        hidden: true
        options: *transparent_choices

  footer:
    label: Footer
    description: Footer copy, contact details, and optional background styling.
    columns: 2
    fields:
      layout:
        type: select
        label: Layout
        default: columns
        options:
          columns: Columns
          mega: 'Mega: a column for each top-level link of the footer menu'
          simple: One row
          bar: 'Bar: copyright on the left, links on the right'
          centered: Centered
      tone:
        type: select
        label: Background
        default: dark
        help: A solid colour. A colour or an image below replaces it.
        options:
          dark: Dark
          light: Page background
          muted: Muted
          accent: Palette colour
      brand:
        type: select
        label: Brand
        default: name
        options:
          name: Site name
          logo: Logo
          none: Nothing
      show_social:
        type: toggle
        label: Social icons
        default: true
      show_language:
        type: toggle
        label: Language switcher
        default: false
      back_to_top:
        type: toggle
        label: Back to top link
        default: false
      copyright:
        type: text
        label: Copyright line
        default: ''
        placeholder: © {year} {site}. All rights reserved.
        help: "{year} and {site} are filled in. Empty uses the theme's own line."
        span: full
      summary:
        type: textarea
        label: Summary
        default: ''
        span: full
      email:
        type: email
        label: Email
        default: ''
      phone:
        type: text
        label: Phone
        default: ''
      address:
        type: text
        label: Address
        default: ''
        span: full
      hours:
        type: text
        label: Opening hours
        default: ''
        placeholder: Mon–Fri 9:00–17:00
        span: full
      cta_heading:
        type: text
        label: Call to action heading
        default: ''
        placeholder: Ready to start?
      cta_label:
        type: text
        label: Call to action button text
        default: ''
        placeholder: Get in touch
      cta_text:
        type: text
        label: Call to action text
        default: ''
      cta_url:
        type: link
        label: Call to action button link
        default: ''
        placeholder: contact
      background:
        type: color
        label: Background color
        default: ''
        placeholder: '#0f172a'
      background_image:
        type: image
        label: Background image
        default: ''
        placeholder: /uploads/media/footer.jpg
