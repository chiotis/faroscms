# Books: a title, a cover, a description, and the facts a reader looks for. Switch it on in Admin > Content types.
# Sites can add fields or change the archive in custom/content-types/books.yaml (kept across updates).
# Never rename a field key: content refers to it by name. Retire a field with `hidden: true`.
label: { el: Βιβλία, en: Books }
singular: { el: Βιβλίο, en: Book }
description: { el: 'Βιβλία με εξώφυλλο, περιγραφή και στοιχεία έκδοσης.', en: 'Books with a cover, a description and the details of their editions.' }
fields:
  author:
    type: text
    label: { el: Συγγραφέας, en: Author }
    card: true
    show: false
  publisher:
    type: text
    label: { el: Εκδότης, en: Publisher }
  year:
    type: number
    label: { el: Έτος έκδοσης, en: Year }
    min: 1400
    max: 2100
  isbn:
    type: text
    label: ISBN
  language:
    type: text
    label: { el: Γλώσσα, en: Language }
  buy_url:
    type: link
    label: { el: 'Σύνδεσμος αγοράς', en: 'Where to buy' }
    show: false
  buy_label:
    type: text
    label: { el: 'Κείμενο συνδέσμου αγοράς', en: 'Buy link text' }
    placeholder: Buy the book
    show: false
# Options of the book page and of the list, drawn on the cards of Theme > Single Layouts and Archive Layouts (see ContentTypes.php).
# The page draws its own sidebar and sits under a transparent header when the card asks for one.
single:
  sidebar: true
  header: true
  options:
    cover:
      type: select
      label: { el: Εξώφυλλο, en: Cover }
      default: left
      options:
        left: { el: Αριστερά, en: Left }
        right: { el: Δεξιά, en: Right }
        top: { el: Από πάνω, en: Above }
    cover_style:
      type: select
      label: { el: 'Στυλ εξωφύλλου', en: Cover style }
      default: book
      options:
        book: { el: Βιβλίο, en: Book }
        flat: { el: Απλή εικόνα, en: Flat picture }
    show_author: { type: toggle, label: { el: Συγγραφέας, en: Author }, default: true }
    show_summary: { type: toggle, label: { el: Περίληψη, en: Summary }, default: true }
    show_facts: { type: toggle, label: { el: Στοιχεία έκδοσης, en: Details }, default: true }
    show_buy: { type: toggle, label: { el: Κουμπί αγοράς, en: Buy button }, default: true }
archive_options:
  cover_shape:
    type: select
    label: { el: Εξώφυλλα, en: Covers }
    default: portrait
    options:
      portrait: { el: Κάθετα, en: Portrait }
      square: { el: Τετράγωνα, en: Square }
      landscape: { el: Οριζόντια, en: Landscape }
archive:
  layout: cards
  columns: '4'
  per_page: 12
  order: title_asc
  show_excerpt: false
  show_meta: false
  taxonomies: [categories]
