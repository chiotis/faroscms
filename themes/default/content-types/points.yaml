# Points of interest: a place worth a stop, with its position. Switch it on in Admin > Content types.
# Sites can add fields or change the list in custom/content-types/points.yaml (kept across updates).
# Never rename a field key: content refers to it by name. Retire a field with `hidden: true`.
label: { el: Σημεία, en: Points of interest }
singular: { el: Σημείο, en: Point of interest }
description: { el: 'Σημεία ενδιαφέροντος με θέση στον χάρτη: αξιοθέατα, πηγές, θέες, μνημεία.', en: 'Places worth a stop, with their position on the map: sights, springs, viewpoints, monuments.' }
fields:
  location:
    type: location
    label: { el: Θέση, en: Location }
    placeholder: '35.2012, 26.2744'
    help: { el: 'Γεωγραφικό πλάτος και μήκος, όπως τα αντιγράφει το Google Maps ή το OpenStreetMap.', en: 'Latitude and longitude, as Google Maps or OpenStreetMap copy them.' }
    show: false
  area:
    type: text
    label: { el: Περιοχή, en: Area }
    placeholder: { el: 'Δήμος ή χωριό', en: 'Municipality or village' }
    card: true
  altitude:
    type: number
    label: { el: 'Υψόμετρο (μ.)', en: Altitude (m) }
    min: -500
    max: 9000
  opening_hours:
    type: text
    label: { el: Ωράριο, en: Opening hours }
  admission:
    type: text
    label: { el: Είσοδος, en: Admission }
    placeholder: { el: Ελεύθερη, en: Free }
  accessible:
    type: toggle
    label: { el: 'Προσβάσιμο σε αναπηρικό αμαξίδιο', en: Wheelchair accessible }
  website:
    type: url
    label: { el: Ιστότοπος, en: Website }
  phone:
    type: text
    label: { el: Τηλέφωνο, en: Phone }
# What the page of a point does, and what its list does (Theme > Single Layouts and Archive Layouts).
single:
  sidebar: false
  header: true
  options:
    show_map: { type: toggle, label: { el: Χάρτης, en: Map }, default: true }
    map_height:
      type: select
      label: { el: 'Ύψος χάρτη', en: Map height }
      default: medium
      options:
        small: { el: Μικρό, en: Small }
        medium: { el: Μεσαίο, en: Medium }
        large: { el: Μεγάλο, en: Large }
    show_facts: { type: toggle, label: { el: Πληροφορίες, en: Information }, default: true }
    show_nearby: { type: toggle, label: { el: 'Κοντινά σημεία', en: Nearby places }, default: true }
    nearby_radius: { type: number, label: { el: 'Ακτίνα κοντινών (χλμ.)', en: Nearby radius (km) }, default: 5, min: 1, max: 50 }
archive:
  title: { el: Σημεία ενδιαφέροντος, en: Points of interest }
  subtitle: { el: 'Τα σημεία που αξίζει να δείτε, στον χάρτη και σε λίστα.', en: 'The places worth seeing, on the map and in a list.' }
  layout: map
  per_page: 0
  order: title_asc
  show_excerpt: false
  show_meta: true
  taxonomies: [categories]
