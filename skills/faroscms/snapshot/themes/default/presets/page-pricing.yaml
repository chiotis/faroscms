kind: page
label: { el: 'Σελίδα τιμών', en: 'Pricing page' }
description: { el: 'Πακέτα με διακόπτη μηνιαίο/ετήσιο, σύγκριση, τι περιλαμβάνεται σε όλα, ερωτήσεις και κάλεσμα.', en: 'Plans with a monthly/yearly switch, a comparison, what every plan includes, questions, and a call to action.' }
blocks:
  el:
    - { type: hero, variant: minimal, eyebrow: 'Τιμές', heading: 'Απλές τιμές, χωρίς εκπλήξεις', text: 'Διαλέξτε το πακέτο που ταιριάζει και αλλάξτε όποτε θέλετε.' }
    - { type: pricing, variant: cards, billing_switch: true, yearly_note: 'Εξοικονόμηση 2 μηνών', note: 'Οι τιμές δεν περιλαμβάνουν ΦΠΑ.', items: [{ name: 'Βασικό', description: 'Για να ξεκινήσετε.', price: '€19', period: 'ανά μήνα', yearly_price: '€190', yearly_period: 'ανά έτος', features: "Μία ιστοσελίδα\nΒασικές λειτουργίες\nΥποστήριξη με email", button_label: 'Ξεκινήστε', button_url: contact }, { name: 'Ομάδα', badge: 'Δημοφιλές', highlight: true, description: 'Για ομάδες που μεγαλώνουν.', price: '€49', period: 'ανά μήνα', yearly_price: '€490', yearly_period: 'ανά έτος', features: "Έως 5 ιστοσελίδες\nΌλες οι λειτουργίες\nΠροτεραιότητα στην υποστήριξη", button_label: 'Ξεκινήστε', button_url: contact }, { name: 'Επιχείρηση', description: 'Για μεγάλους οργανισμούς.', price: 'Κατόπιν συζήτησης', features: "Απεριόριστες ιστοσελίδες\nΠροσαρμοσμένη ενσωμάτωση\nΣυμφωνία επιπέδου υπηρεσίας", button_label: 'Επικοινωνήστε', button_url: contact }] }
    - { type: compare, variant: striped, tone: muted, eyebrow: 'Σύγκριση', heading: 'Τι περιλαμβάνει κάθε πακέτο', columns: [{ name: 'Βασικό' }, { name: 'Ομάδα', highlight: true }, { name: 'Επιχείρηση' }], rows: [{ label: 'Ιστοσελίδες', v1: '1', v2: '5', v3: 'Απεριόριστες' }, { label: 'Χρήστες', v1: '2', v2: '10', v3: 'Απεριόριστοι' }, { label: 'Υποστήριξη', v1: Email, v2: 'Προτεραιότητα', v3: 'Αποκλειστική' }] }
    - { type: checklist, variant: cards, columns: '3', heading: 'Σε όλα τα πακέτα', items: [{ text: 'Δωρεάν ενημερώσεις' }, { text: 'Καθημερινά αντίγραφα ασφαλείας' }, { text: 'Ασφαλής φιλοξενία' }, { text: 'Χωρίς συμβόλαιο' }, { text: 'Εύκολη μετάβαση' }, { text: 'Δοκιμή 14 ημερών' }] }
    - { type: faq, variant: split, tone: muted, eyebrow: 'Ερωτήσεις', heading: 'Για τις τιμές', items: [{ question: 'Μπορώ να αλλάξω πακέτο;', answer: 'Ναι, όποτε θέλετε. Η αλλαγή ισχύει από τον επόμενο κύκλο.' }, { question: 'Υπάρχει δοκιμαστική περίοδος;', answer: 'Εξηγήστε πώς λειτουργεί η δοκιμή.' }, { question: 'Ποιοι τρόποι πληρωμής υπάρχουν;', answer: 'Αναφέρετε κάρτες, τραπεζική κατάθεση κ.λπ.' }] }
    - { type: cta, variant: band, heading: 'Δεν είστε σίγουροι ποιο ταιριάζει;', text: 'Πείτε μας τι χρειάζεστε και θα προτείνουμε εμείς.', actions: [{ label: 'Μιλήστε μαζί μας', url: contact }] }
  en:
    - { type: hero, variant: minimal, eyebrow: Pricing, heading: 'Simple prices, no surprises', text: 'Pick the plan that fits and change whenever you like.' }
    - { type: pricing, variant: cards, billing_switch: true, yearly_note: 'Save 2 months', note: 'Prices exclude VAT.', items: [{ name: Starter, description: 'To get started.', price: '€19', period: 'per month', yearly_price: '€190', yearly_period: 'per year', features: "One site\nCore features\nEmail support", button_label: 'Get started', button_url: contact }, { name: Team, badge: 'Most popular', highlight: true, description: 'For growing teams.', price: '€49', period: 'per month', yearly_price: '€490', yearly_period: 'per year', features: "Up to 5 sites\nAll features\nPriority support", button_label: 'Get started', button_url: contact }, { name: Business, description: 'For larger organisations.', price: 'Let us talk', features: "Unlimited sites\nCustom integration\nService level agreement", button_label: 'Contact us', button_url: contact }] }
    - { type: compare, variant: striped, tone: muted, eyebrow: Compare, heading: 'What each plan includes', columns: [{ name: Starter }, { name: Team, highlight: true }, { name: Business }], rows: [{ label: Sites, v1: '1', v2: '5', v3: Unlimited }, { label: Users, v1: '2', v2: '10', v3: Unlimited }, { label: Support, v1: Email, v2: Priority, v3: Dedicated }] }
    - { type: checklist, variant: cards, columns: '3', heading: 'In every plan', items: [{ text: 'Free updates' }, { text: 'Daily backups' }, { text: 'Secure hosting' }, { text: 'No contract' }, { text: 'Easy migration' }, { text: '14-day trial' }] }
    - { type: faq, variant: split, tone: muted, eyebrow: Questions, heading: 'About pricing', items: [{ question: 'Can I change plans?', answer: 'Yes, whenever you like. The change applies from the next cycle.' }, { question: 'Is there a trial?', answer: 'Explain how the trial works.' }, { question: 'Which payment methods do you accept?', answer: 'Mention cards, bank transfer, and so on.' }] }
    - { type: cta, variant: band, heading: 'Not sure which fits?', text: 'Tell us what you need and we will recommend one.', actions: [{ label: 'Talk to us', url: contact }] }
