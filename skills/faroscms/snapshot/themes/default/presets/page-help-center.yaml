    - { type: faq, variant: split, tone: muted, eyebrow: 'Συχνές ερωτήσεις', heading: 'Οι πιο συχνές ερωτήσεις', items: [{ question: 'Πώς ξεκινάω;', answer: 'Γράψτε τα πρώτα βήματα.' }, { question: 'Πώς αλλάζω τον κωδικό μου;', answer: 'Εξηγήστε πού βρίσκεται η ρύθμιση.' }, { question: 'Πώς ακυρώνω τη συνδρομή μου;', answer: 'Εξηγήστε τη διαδικασία.' }, { question: 'Πού βρίσκω τα τιμολόγιά μου;', answer: 'Εξηγήστε πού βρίσκονται.' }] }
