kind: page
label: { el: 'Κέντρο βοήθειας / FAQ', en: 'FAQ and help center' }
description: { el: 'Θέματα βοήθειας, συχνές ερωτήσεις και κάλεσμα προς την υποστήριξη.', en: 'Help topics, common questions, and a call to contact support.' }
blocks:
