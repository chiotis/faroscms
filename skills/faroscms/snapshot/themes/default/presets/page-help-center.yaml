  en:
    - { type: hero, variant: centered, eyebrow: 'Help center', heading: 'How can we help?', text: 'Find answers to the most common topics or write to us.' }
    - { type: features, variant: cards, columns: '3', heading: Topics, items: [{ icon: rocket, title: 'Getting started', text: 'First steps and settings.', link: contact, link_label: 'See articles' }, { icon: users, title: Account, text: 'Details, passwords, users.', link: contact, link_label: 'See articles' }, { icon: briefcase, title: Billing, text: 'Invoices and payments.', link: contact, link_label: 'See articles' }, { icon: shield, title: Security, text: 'Protecting your data.', link: contact, link_label: 'See articles' }, { icon: compass, title: Guides, text: 'Step by step.', link: contact, link_label: 'See articles' }, { icon: info, title: 'Other topics', text: 'Whatever fits nowhere else.', link: contact, link_label: 'See articles' }] }
    - { type: faq, variant: split, tone: muted, eyebrow: FAQ, heading: 'The most common questions', items: [{ question: 'How do I start?', answer: 'Write the first steps.' }, { question: 'How do I change my password?', answer: 'Explain where the setting is.' }, { question: 'How do I cancel my subscription?', answer: 'Explain the process.' }, { question: 'Where do I find my invoices?', answer: 'Explain where they are.' }] }
    - { type: cta, variant: card, heading: 'Did not find an answer?', text: 'The support team usually replies within one working day.', actions: [{ label: 'Contact support', url: contact }] }
