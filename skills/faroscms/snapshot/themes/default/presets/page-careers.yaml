kind: page
label: { el: 'Καριέρα', en: Careers }
description: { el: 'Αξίες, παροχές, ανοιχτές θέσεις, διαδικασία πρόσληψης και ερωτήσεις υποψηφίων.', en: 'Values, benefits, open roles, the hiring process, and candidate questions.' }
blocks:
  el:
    - { type: hero, variant: minimal, eyebrow: 'Καριέρα', heading: 'Ελάτε στην ομάδα μας', text: 'Δουλεύουμε με ανθρώπους που τους ενδιαφέρει η δουλειά τους. Δείτε τις θέσεις που είναι ανοιχτές.', actions: [{ label: 'Δείτε τις θέσεις', url: '#roles' }] }
    - { type: features, variant: plain, eyebrow: 'Οι αξίες μας', heading: 'Πώς δουλεύουμε', columns: '3', items: [{ icon: heart, title: 'Φροντίδα', text: 'Για τους ανθρώπους και τη δουλειά.' }, { icon: lightbulb, title: 'Περιέργεια', text: 'Μαθαίνουμε συνεχώς.' }, { icon: users, title: 'Ομαδικότητα', text: 'Κερδίζουμε μαζί.' }] }
    - { type: checklist, variant: cards, tone: muted, heading: 'Τι προσφέρουμε', columns: '3', items: [{ text: 'Ευέλικτο ωράριο' }, { text: 'Εξ αποστάσεως εργασία' }, { text: 'Προϋπολογισμός εκπαίδευσης' }, { text: 'Ιδιωτική ασφάλιση υγείας' }, { text: 'Επιπλέον ημέρες άδειας' }, { text: 'Ετήσια συνάντηση ομάδας' }] }
