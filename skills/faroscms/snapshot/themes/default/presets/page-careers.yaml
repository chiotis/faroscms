    - { type: timeline, variant: steps, tone: muted, eyebrow: 'Η διαδικασία', heading: 'Πώς προσλαμβάνουμε', items: [{ label: '01', title: 'Αίτηση' }, { label: '02', title: 'Συζήτηση γνωριμίας' }, { label: '03', title: 'Μικρή άσκηση' }, { label: '04', title: 'Πρόταση' }] }
    - { type: faq, variant: stacked, heading: 'Ερωτήσεις υποψηφίων', items: [{ question: 'Δεν βλέπω θέση για μένα.', answer: 'Στείλτε μας ένα σύντομο μήνυμα· κρατάμε τους φακέλους.' }, { question: 'Πόσο διαρκεί η διαδικασία;', answer: 'Συνήθως δύο με τρεις εβδομάδες.' }] }
  en:
    - { type: hero, variant: minimal, eyebrow: Careers, heading: 'Join our team', text: 'We work with people who care about what they do. See the roles that are open.', actions: [{ label: 'See open roles', url: '#roles' }] }
    - { type: features, variant: plain, eyebrow: 'Our values', heading: 'How we work', columns: '3', items: [{ icon: heart, title: Care, text: 'For people and for the work.' }, { icon: lightbulb, title: Curiosity, text: 'We keep learning.' }, { icon: users, title: Teamwork, text: 'We win together.' }] }
    - { type: checklist, variant: cards, tone: muted, heading: 'What we offer', columns: '3', items: [{ text: 'Flexible hours' }, { text: 'Remote work' }, { text: 'Learning budget' }, { text: 'Health insurance' }, { text: 'Extra days off' }, { text: 'Yearly team meet-up' }] }
    - { type: cards, variant: list, anchor: roles, eyebrow: 'Open roles', heading: 'Find your role', items: [{ title: 'Role title', meta: 'Athens · Full time', text: 'One sentence about the role.', url: contact }, { title: 'Role title', meta: 'Remote · Full time', text: 'One sentence about the role.', url: contact }, { title: 'Role title', meta: 'Thessaloniki · Part time', text: 'One sentence about the role.', url: contact }] }
    - { type: timeline, variant: steps, tone: muted, eyebrow: 'The process', heading: 'How we hire', items: [{ label: '01', title: Apply }, { label: '02', title: 'Intro call' }, { label: '03', title: 'Small task' }, { label: '04', title: Offer }] }
    - { type: faq, variant: stacked, heading: 'Candidate questions', items: [{ question: 'I do not see a role for me.', answer: 'Send us a short message; we keep applications on file.' }, { question: 'How long does it take?', answer: 'Usually two to three weeks.' }] }
