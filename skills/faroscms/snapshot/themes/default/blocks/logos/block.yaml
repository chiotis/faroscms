label: Logos
description: Client or partner logos, spread over the whole width of the content however many there are. Without an image the name is shown as text.
category: Showcase
variants:
  row: Single row
  grid: Framed grid
spacing: compact
fields:
  heading:
    type: text
    label: Heading
    placeholder: Trusted by
  size:
    type: select
    label: Height of the logos
    default: medium
    options:
      small: Small
      medium: Medium
      large: Large
      xlarge: Extra large
  colors:
    type: select
    label: Colour of the logos
    default: hover
    options:
      hover: Black and white, in colour when pointed at
      mono: Always black and white
      color: Their own colours
  items:
    type: repeater
    label: Logos
    item_label: Logo
    max: 18
    fields:
      name: { type: text, label: Name, help: Used as the logo's alternative text. }
      image: { type: image, label: Logo image }
      url: { type: link, label: Link }
