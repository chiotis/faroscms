project:
  name: "my-theme-from-html"
  source_demo: "replace-with-demo-name"
  notes: "single demo first, then expand"

templates:
  home: "replace-home-file.html"
  single_page: "replace-single-page-file.html"
  single_post: "replace-single-post-file.html"
  single_project: "replace-single-project-file.html"
  archive_general: "replace-archive-general-file.html"
  archive_posts: "replace-archive-posts-file.html"
  archive_projects: "replace-archive-projects-file.html"
  search: ""
  not_found: ""

selectors:
  header: "header"
  footer: "footer"
  main: "main"
  post_loop: ".blog-wrapper"
  post_item: ".blog-wrapper .grid-item"
  project_loop: ".portfolio-wrapper"
  project_item: ".portfolio-wrapper .grid-item"
  pagination: ".pagination"

assets:
  css_root: "css"
  js_root: "js"
  images_root: "images"
  fonts_root: "fonts"

behavior:
  replace_header_with_cms: true
  replace_footer_with_cms: true
  keep_template_layout_for_content: true
  use_runtime_html_patching: false

