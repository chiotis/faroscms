<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — phpFlat Admin</title>
<!-- PRODUCTION: replace CDN with <link rel="stylesheet" href="/assets/css/app.css"> -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Inter Tight"','ui-sans-serif','system-ui','sans-serif'] } } } };</script>
<link rel="stylesheet" href="../public/assets/css/app.css">
</head>

<body class="flex h-full items-center justify-center bg-slate-100 px-4 font-sans text-slate-800 antialiased">

<button type="button" onclick="toggleTheme()" data-theme-toggle title="Toggle theme" class="fixed right-4 top-4 rounded-md p-1.5 text-slate-500 hover:bg-slate-200"></button>

<div class="w-full max-w-sm">

  <!-- Brand -->
  <div class="mb-6 flex items-center justify-center gap-2.5">
    <div class="flex h-8 w-8 items-center justify-center rounded bg-slate-900 text-sm font-bold text-white">pF</div>
    <span class="text-base font-semibold tracking-tight text-slate-900">phpFlat Admin</span>
  </div>

  <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-lg font-semibold text-slate-900">Sign in</h1>
    <p class="mt-0.5 text-sm text-slate-500">Use your administrator credentials.</p>

    <!-- Error state (toggle by removing 'hidden') -->
    <div class="mt-4 flex items-start gap-2.5 rounded-md border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-700">
      <svg class="mt-0.5 h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <span>Invalid email or password. Please try again.</span>
    </div>

    <form class="mt-5 space-y-4" action="dashboard.html" method="post">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
        <input id="email" name="email" type="email" value="sara@phpflat.dev" autocomplete="username"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
      </div>

      <div>
        <div class="mb-1 flex items-center justify-between">
          <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
          <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-700">Forgot password?</a>
        </div>
        <input id="password" name="password" type="password" value="········" autocomplete="current-password"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500/30">
        Keep me signed in
      </label>

      <button type="submit" class="w-full rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
        Sign in
      </button>
    </form>

    <!-- Divider -->
    <div class="my-5 flex items-center gap-3">
      <div class="h-px flex-1 bg-slate-200"></div>
      <span class="text-xs font-medium uppercase tracking-wide text-slate-400">or</span>
      <div class="h-px flex-1 bg-slate-200"></div>
    </div>

    <!-- Google Sign-In -->
    <button type="button" class="flex w-full items-center justify-center gap-2.5 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">
      <svg class="h-4 w-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.76h3.57c2.08-1.92 3.27-4.74 3.27-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.76c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.18V7.07H2.18a11 11 0 000 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 002.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
      Continue with Google
    </button>
  </div>

  <p class="mt-5 text-center text-xs text-slate-400">phpFlat Admin · Authorized personnel only</p>
</div>

<script src="../public/assets/js/admin.js"></script>
</body>
</html>
