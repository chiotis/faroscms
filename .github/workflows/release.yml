name: Release

# When VERSION changes on main, tag it (v0.1.2) and publish a GitHub Release with that version's CHANGELOG entry, so the
# version is visible on the repository page. The site's update check reads the VERSION file itself, not these releases.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release."
            exit 0
          fi
          # The CHANGELOG entry whose heading starts with the version, up to the next heading.
          awk -v v="$version" '$0 ~ ("^## " v "( |$)") {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "FarosCMS ${version}" --notes-file notes.md
